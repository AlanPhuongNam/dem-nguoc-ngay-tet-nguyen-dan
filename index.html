<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đếm Ngược Ngày Thi Khảo Sát THPTQG Lần 1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background-image: url('view-from-the-airplane-window-beautiful-cloudscape-with-blue-sky-wonderful-panorama-above-white-clouds-as-seen-through-window-of-an-plane-traveling-by-air-concept-free-photo.jpg');    /* Đổi thành tên file hoặc link ảnh */
         background-size: cover;                  /* Giúp ảnh luôn vừa vặn toàn màn hình */
         background-position: center;             /* Căn ảnh ở giữa màn hình */
         background-repeat: no-repeat;            /* Không lặp lại ảnh */
         background-attachment: fixed;            /* Cố định nền khi cuộn trang */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }
/* ================= GIAO DIỆN MẶC ĐỊNH (KHI NỀN TỐI) ================= */
    .tag {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid #52658b;
      border-radius: 30px;
      color: #c3d4ff;
      font-size: 13px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 58px);
      margin: 25px 0 12px;
      line-height: 1.2;
    }

    .subtitle {
      color: #b8c5df;
      font-size: 17px;
      line-height: 1.7;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 40px 0 30px;
    }

    .time-box {
      padding: 26px 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(174, 197, 255, 0.2);
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }

    .number {
      font-size: clamp(30px, 6vw, 54px);
      font-weight: bold;
      color: #8bb8ff;
      font-variant-numeric: tabular-nums;
    }

    .label {
      margin-top: 12px;
      font-size: 13px;
      color: #c5d1e8;
      letter-spacing: 1px;
    }

    .message {
      padding: 22px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #d9e4ff;
      line-height: 1.8;
      backdrop-filter: blur(12px);
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #e2e8f0;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* ================= GIAO DIỆN TƯƠNG PHẢN (KHI NỀN SÁNG) ================= */
    body.light-mode {
      color: #111827;
    }

    body.light-mode h1 {
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.7);
    }

    body.light-mode .tag {
      border-color: rgba(30, 58, 138, 0.4);
      color: #1e3a8a;
      background: rgba(255, 255, 255, 0.65);
    }

    body.light-mode .subtitle {
      color: #1f2937;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.6);
    }

    body.light-mode .time-box {
      background: rgba(255, 255, 255, 0.65); /* Khung kính mờ sáng */
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
    }

    body.light-mode .number {
      color: #1d4ed8; /* Số xanh đậm nổi bật */
    }

    body.light-mode .label {
      color: #4b5563;
      font-weight: 600;
    }

    body.light-mode .message {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #1f2937;
    }

    body.light-mode .footer {
      color: #374151;
      text-shadow: none;
    }
    @media (max-width: 520px) {
      .timer {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin: 28px 0;
      }

      .time-box {
        padding: 22px 5px;
      }

      .label {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="tag">Ngày thi: 25/11/2026</div>

    <h1>Đếm Ngược Ngày Thi Khảo Sát THPTQG Lần 1</h1>

    <p class="subtitle">
      Mỗi ngày cố gắng một chút,<br>
      tương lai sẽ tiến gần hơn một chút.
    </p>

    <div class="timer">
      <div class="time-box">
        <div class="number" id="days">000</div>
        <div class="label">NGÀY</div>
      </div>

      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="label">GIỜ</div>
      </div>

      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="label">PHÚT</div>
      </div>

      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="label">GIÂY</div>
      </div>
    </div>

    <div class="message" id="message">
      Hãy tập trung vào mục tiêu của bạn.
      Một ngày nỗ lực hôm nay sẽ tạo nên khác biệt ngày mai!
    </div>

    <div class="footer">
      Thi tốt nhaaaaaa!!!
    </div>
  </main>

  <script>
    // Sửa ngày giờ bên dưới thành thời điểm thi của bạn.
    // Ví dụ: ngày 25/11/2026 lúc 07:30 sáng.
    const examDate = new Date("2026-11-25T07:30:00+07:00");

    function updateCountdown() {
      const now = new Date();
      const difference = examDate.getTime() - now.getTime();

      if (difference <= 0) {
        document.getElementById("days").textContent = "000";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        document.getElementById("message").textContent =
          "Chúc bạn hoàn thành kỳ thi thật tốt!";
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById("days").textContent =
        String(days).padStart(3, "0");
      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
    // 2. Logic tự động phát hiện độ sáng ảnh nền để đổi màu chữ/khung
    function autoAdjustContrast(imageSrc) {
      const img = new Image();
      img.src = imageSrc;
      img.onload = function() {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 50;
        canvas.height = 50;
        ctx.drawImage(img, 0, 0, 50, 50);

        const imgData = ctx.getImageData(0, 0, 50, 50).data;
        let totalBrightness = 0;
        let count = 0;

        for (let i = 0; i < imgData.length; i += 4) {
          // Tính độ sáng theo chuẩn mắt nhìn (ITU-R BT.709)
          const brightness = 0.2126 * imgData[i] + 0.7152 * imgData[i + 1] + 0.0722 * imgData[i + 2];
          totalBrightness += brightness;
          count++;
        }

        const avgBrightness = totalBrightness / count;
        // Nếu độ sáng > 130 (ảnh sáng), thêm class light-mode để chữ/khung hóa tối
        if (avgBrightness > 130) {
          document.body.classList.add("light-mode");
        } else {
          document.body.classList.remove("light-mode");
        }
      };
    }

    // Gọi hàm với tên file ảnh nền bạn đang sử dụng:
    autoAdjustContrast("view-from-the-airplane-window-beautiful-cloudscape-with-blue-sky-wonderful-panorama-above-white-clouds-as-seen-through-window-of-an-plane-traveling-by-air-concept-free-photo.jpg");
  </script>
</body>
</html>
